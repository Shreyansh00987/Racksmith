<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racksmith — Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:#07080d;--fg:#8d93b8}
html,body{margin:0;padding:0;width:1000px;height:420px;overflow:hidden;background:#07080d;color:var(--fg);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px}
svg{width:1000px;height:420px;display:block}
svg text{font-family:'JetBrains Mono',ui-monospace,monospace;user-select:none}
.ttl{font-family:'Space Grotesk',system-ui,sans-serif}
.mod{cursor:pointer}.mod:hover .pnl{stroke:#6b73b8}
.knob{cursor:grab;touch-action:none}.knob:active{cursor:grabbing}
.led{animation:bl 1.6s infinite}@keyframes bl{50%{opacity:.2}}
.bad .ov{animation:fl .6s infinite}@keyframes fl{50%{opacity:.2}}
.chip{cursor:pointer}.chip:hover rect{stroke:#22e3d0}
a rect{transition:fill .2s}a:hover rect{fill:#22e3d033}a{cursor:pointer}
</style></head><body>
<svg id="c" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Racksmith cover">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0b16"/><stop offset="1" stop-color="#150f2b"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#22e3d0" stop-opacity=".28"/><stop offset="1" stop-color="#22e3d0" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#ff4fa3" stop-opacity=".25"/><stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/></radialGradient>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#22e3d0"/><stop offset=".6" stop-color="#ff4fa3"/><stop offset="1" stop-color="#ffb020"/></linearGradient>
<linearGradient id="pnl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1f38"/><stop offset="1" stop-color="#0f1124"/></linearGradient>
<pattern id="gr" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
<filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="g2" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1000" height="420" fill="url(#bg)"/><rect width="1000" height="420" fill="url(#gr)"/>
<circle cx="880" cy="70" r="280" fill="url(#b1)"/><circle cx="90" cy="400" r="260" fill="url(#b2)"/>

<!-- left column -->
<rect x="40" y="38" width="292" height="22" rx="11" fill="#ffffff0d" stroke="#ffffff2a"/>
<circle cx="54" cy="49" r="3.5" fill="#22e3d0" class="led"/>
<text x="64" y="53" font-size="10" fill="#cfd3e6" letter-spacing=".6">SANITY CONTEXT MCP · HACKATHON v2.0</text>
<text class="ttl" x="40" y="146" font-size="66" font-weight="700" textLength="390" lengthAdjust="spacingAndGlyphs" fill="url(#tg)" filter="url(#gl)" opacity=".55">RACKSMITH</text>
<text class="ttl" x="40" y="146" font-size="66" font-weight="700" textLength="390" lengthAdjust="spacingAndGlyphs" fill="url(#tg)">RACKSMITH</text>
<g class="ttl" font-size="17" fill="#cfd3e6" font-weight="500">
<text x="40" y="184">A modular synth rack planner that</text>
<text x="40" y="207">knows what actually fits, powers on,</text>
<text x="40" y="230">and won't fry your modules.</text></g>
<g font-size="10" fill="#cfd3e6">
<rect x="40" y="246" width="66" height="22" rx="11" fill="#22e3d01a" stroke="#22e3d088"/><text x="73" y="261" text-anchor="middle">HP WIDTH</text>
<rect x="114" y="246" width="109" height="22" rx="11" fill="#ff4fa31a" stroke="#ff4fa388"/><text x="168" y="261" text-anchor="middle">DEPTH CLEARANCE</text>
<rect x="231" y="246" width="106" height="22" rx="11" fill="#ffb0201a" stroke="#ffb02088"/><text x="284" y="261" text-anchor="middle">±12V / +5V RAILS</text></g>
<path id="w1" fill="none" stroke="#22e3d0" stroke-width="5" opacity=".5" filter="url(#g2)"/>
<path id="w2" fill="none" stroke="url(#tg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="344" font-size="9" fill="#7c82a8" letter-spacing="1">BUILT FOR SANITY HACKATHON · PATH 1</text>
<g font-size="11" fill="#e8ebff" font-weight="700" text-anchor="middle">
<a href="https://racksmith.vercel.app" target="_blank" rel="noopener"><rect x="40" y="356" width="96" height="28" rx="8" fill="#ffffff10" stroke="#22e3d0"/><text x="88" y="374">LIVE APP ↗</text></a>
<a href="https://racksmith.vercel.app/studio" target="_blank" rel="noopener"><rect x="144" y="356" width="88" height="28" rx="8" fill="#ffffff10" stroke="#ff4fa3"/><text x="188" y="374">STUDIO ↗</text></a>
<a href="https://github.com/Shreyansh00987/Racksmith" target="_blank" rel="noopener"><rect x="240" y="356" width="92" height="28" rx="8" fill="#ffffff10" stroke="#ffb020"/><text x="286" y="374">GITHUB ↗</text></a>
<a href="https://youtu.be/6P5E7SOY9S0" target="_blank" rel="noopener"><rect x="340" y="356" width="92" height="28" rx="8" fill="#ffffff10" stroke="#a78bfa"/><text x="386" y="374">▶ VIDEO</text></a></g>
<text x="40" y="408" font-size="9" fill="#5b6088">racksmith.vercel.app · Next.js · Sanity Context MCP · Three.js</text>

<!-- rack -->
<g id="rk">
<rect x="456" y="30" width="528" height="236" rx="6" fill="#0a0b14" stroke="#2c3050"/>
<rect x="456" y="30" width="528" height="14" rx="4" fill="#1a1d33"/><rect x="456" y="252" width="528" height="14" rx="4" fill="#1a1d33"/>
<g fill="#07080d" stroke="#555b8a"><circle cx="468" cy="37" r="3"/><circle cx="972" cy="37" r="3"/><circle cx="468" cy="259" r="3"/><circle cx="972" cy="259" r="3"/></g>
<g id="mods"></g><g id="cabs"></g>
</g>

<!-- status -->
<rect x="456" y="280" width="528" height="56" rx="8" fill="#0e1020" stroke="#2c3050"/>
<text x="474" y="297" font-size="8" fill="#7c82a8" letter-spacing="1">RACK VERIFICATION</text>
<circle id="sd" cx="480" cy="316" r="5" fill="#22e3d0"/>
<text id="st" class="ttl" x="492" y="322" font-size="17" font-weight="700" fill="#22e3d0">ALL CLEAR</text>
<text id="hpt" x="650" y="297" font-size="8" fill="#7c82a8" letter-spacing="1">HP 64 / 84</text>
<rect x="650" y="304" width="110" height="6" rx="3" fill="#1b1e35"/><rect id="hpb" x="650" y="304" width="84" height="6" rx="3" fill="#22e3d0"/>
<text x="650" y="326" font-size="8" fill="#5b6088">7U · 84HP CASE</text>
<g font-size="8" fill="#7c82a8">
<text x="790" y="294">+12V</text><text x="790" y="306">−12V</text><text x="790" y="318">+5V</text></g>
<g fill="#1b1e35"><rect x="822" y="288" width="140" height="5" rx="2.5"/><rect x="822" y="300" width="140" height="5" rx="2.5"/><rect x="822" y="312" width="140" height="5" rx="2.5"/></g>
<g id="rb"><rect x="822" y="288" width="70" height="5" rx="2.5" fill="#22e3d0"/><rect x="822" y="300" width="56" height="5" rx="2.5" fill="#ff4fa3"/><rect x="822" y="312" width="40" height="5" rx="2.5" fill="#ffb020"/></g>
<text id="msg" x="456" y="354" font-size="10.5" fill="#cfd3e6">Ambient 7U rack · 5 modules fit · power within limits.</text>
<g id="chips" font-size="9.5" text-anchor="middle"></g>
</svg>

<script>
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const mods=[
 {n:'A-110',hp:10,k:2,j:2,c:'#22e3d0',i:'Doepfer A-110 · 10HP · oscillator'},
 {n:'VCF',hp:10,k:3,j:3,c:'#ff4fa3',i:'Filter · 10HP · +12V / −12V'},
 {n:'MATHS',hp:20,k:4,j:4,c:'#ffb020',i:'Make Noise Maths · 20HP · function generator'},
 {n:'ADSR',hp:8,k:2,j:2,c:'#a78bfa',i:'Envelope · 8HP · modulator'},
 {n:'DELAY',hp:16,k:4,j:3,c:'#5eead4',i:'Delay · 16HP · effect'}];
const knobs=[],jacks=[],kEls=[];let h='',x0=464;
mods.forEach((m,i)=>{
 const w=m.hp*8-4,x=x0+2,cx=x+w/2;jacks[i]=[];
 h+=`<g class="mod" data-i="${i}"><rect class="pnl" x="${x}" y="48" width="${w}" height="200" rx="3" fill="url(#pnl)" stroke="#2c3050"/>
 <text x="${cx}" y="68" text-anchor="middle" font-size="10" font-weight="700" fill="${m.c}" letter-spacing="1">${m.n}</text>
 <circle class="led" cx="${x+9}" cy="58" r="2.5" fill="${m.c}"/>`;
 const cols=w>120?2:1;
 for(let k=0;k<m.k;k++){const col=k%cols,row=Math.floor(k/cols),kx=cols==2?x+w*(col?.72:.28):cx,ky=104+row*44;
  h+=`<g class="knob" data-k="${knobs.length}" transform="translate(${kx} ${ky})"><circle r="16" fill="#0b0c16" stroke="#3a3f66"/><g class="kr"><circle r="12" fill="#1b1e35" stroke="#555b8a"/><line y1="-3" y2="-10" stroke="${m.c}" stroke-width="2.6" stroke-linecap="round"/></g></g>`;
  knobs.push({a:(k*53%200)-100,cx:kx,cy:ky});}
 for(let j=0;j<m.j;j++){const jx=x+w*(j+1)/(m.j+1);jacks[i][j]=[jx,228];
  h+=`<circle cx="${jx}" cy="228" r="7" fill="#07080d" stroke="#555b8a"/><circle cx="${jx}" cy="228" r="3" fill="#000"/>`;}
 h+=`<text x="${cx}" y="245" text-anchor="middle" font-size="8" fill="#5b6088">${m.hp}HP</text>
 <rect class="ov" x="${x}" y="48" width="${w}" height="200" rx="3" fill="none" stroke-width="2.5" opacity="0"/>
 <text class="bd" x="${x+w-7}" y="62" text-anchor="end" font-size="12" font-weight="700"></text></g>`;
 x0+=m.hp*8;});
$('mods').innerHTML=h;
document.querySelectorAll('.knob').forEach(g=>{kEls.push(g.querySelector('.kr'));});
const setK=i=>kEls[i].setAttribute('transform',`rotate(${knobs[i].a})`);knobs.forEach((_,i)=>setK(i));

// cables
const cables=[[0,1,1,0,'#22e3d0'],[1,2,2,0,'#ff4fa3'],[2,3,4,0,'#ffb020'],[3,1,1,1,'#a78bfa']];
cables.forEach(c=>{const a=jacks[c[0]][c[1]],b=jacks[c[2]][c[3]];
 const g=document.createElementNS(NS,'g');
 const sg=34;
 const d=`M${a[0]} ${a[1]}C${a[0]} ${a[1]+sg},${b[0]} ${b[1]+sg},${b[0]} ${b[1]}`;
 g.innerHTML=`<path fill="none" stroke="#000" stroke-opacity=".4" stroke-width="7" stroke-linecap="round" transform="translate(0 3)" d="${d}"/><path fill="none" stroke="${c[4]}" stroke-width="4" stroke-linecap="round" d="${d}"/><circle cx="${a[0]}" cy="${a[1]}" r="5" fill="${c[4]}"/><circle cx="${b[0]}" cy="${b[1]}" r="5" fill="${c[4]}"/>`;
 $('cabs').appendChild(g);});

// waveform static
let d='';
for(let i=0;i<=78;i++){const y=306+10*(Math.sin(i*2.2*.18)+.35*Math.sin(i*2.2*.36));d+=(i?'L':'M')+(40+i*5)+' '+y.toFixed(1);}
$('w1').setAttribute('d',d);$('w2').setAttribute('d',d);

// steps chips
const S=[
 {l:'1 AMBIENT 7U',c:'#34d399'},
 {l:'2 COLLISION',c:'#ff5470'},
 {l:'3 CONFLICT',c:'#ffb020'},
 {l:'4 ERRATA',c:'#34d399'},
 {l:'5 EXPORT BOM',c:'#22e3d0'}];
const cg=$('chips');
S.forEach((s,i)=>{const g=document.createElementNS(NS,'g');
 g.innerHTML=`<rect x="${456+i*106.5}" y="364" width="102" height="26" rx="13" fill="${i===0?s.c+'33':'#ffffff0d'}" stroke="${i===0?s.c:'#ffffff2a'}"/><text x="${456+i*106.5+51}" y="381" fill="#cfd3e6">${s.l}</text>`;cg.appendChild(g);});
</script></body></html>
